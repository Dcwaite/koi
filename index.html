<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Koi</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14171f; color: #e9e4d8;
    font: 15px/1.5 Georgia, "Iowan Old Style", serif; }
  #c { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; cursor: pointer; }
  header { position: fixed; left: 24px; top: 20px; pointer-events: none; -webkit-user-select: none; user-select: none; }
  header p { margin: 0; color: #a59f90; transition: opacity 2.5s ease; }
  header.poked p { opacity: 0; }
</style>
<link rel="stylesheet" href="shop.css?v=4">
</head>
<body>
<canvas id="c"></canvas>
<header id="hd"><p>tap to feed, drag to stir the water.</p></header>
<script src="pond.js?v=4"></script>
<script>
(function () {
  'use strict';
  var S = window.PondSim;
  var canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var hd = document.getElementById('hd');
  var qs = location.search;
  var demo = /[?&]demo=1/.test(qs);
  var seedM = /[?&]seed=(\d+)/.exec(qs);
  var seed = seedM ? +seedM[1] : demo ? 7 : (Math.random() * 4294967296) >>> 0;

  var W = 0, H = 0, dpr = 1, pond = null;
  var wcan = document.createElement('canvas'), wctx = wcan.getContext('2d'), wimg = null;
  var floor = document.createElement('canvas');

  function buildFloor() {
    floor.width = Math.max(1, Math.round(W)); floor.height = Math.max(1, Math.round(H));
    var f = floor.getContext('2d'), rng = S.mulberry32(11), i;
    var R = Math.hypot(W, H) * 0.62;
    var g = f.createRadialGradient(W * 0.46, H * 0.44, 0, W * 0.5, H * 0.5, R);
    g.addColorStop(0, '#1d3a3d'); g.addColorStop(0.55, '#162c33'); g.addColorStop(1, '#0e1a22');
    f.fillStyle = g; f.fillRect(0, 0, W, H);
    // soft mottling so still water is not one flat gradient
    for (i = 0; i < 46; i++) {
      var x = rng() * W, y = rng() * H, r = (0.05 + rng() * 0.16) * Math.min(W, H);
      var light = rng() < 0.45;
      var b = f.createRadialGradient(x, y, 0, x, y, r);
      b.addColorStop(0, light ? 'rgba(70,110,104,0.10)' : 'rgba(6,12,18,0.16)');
      b.addColorStop(1, light ? 'rgba(70,110,104,0)' : 'rgba(6,12,18,0)');
      f.fillStyle = b; f.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
    // a few stones on the bottom, barely there
    for (i = 0; i < 70; i++) {
      var sx = rng() * W, sy = rng() * H, sr = 2 + rng() * 6;
      f.fillStyle = rng() < 0.5 ? 'rgba(120,140,130,0.07)' : 'rgba(0,0,0,0.12)';
      f.beginPath(); f.ellipse(sx, sy, sr, sr * (0.6 + rng() * 0.4), rng() * 3.14, 0, 6.2832); f.fill();
    }
  }

  /* ---------- saving: the koi, their sizes, the plants and the coins ---------- */
  var SAVE_KEY = 'koi-save-v1';
  var saving = !demo && !seedM;                      // a fixed seed or the demo is for testing: never touch the save
  if (/[?&]fresh=1/.test(qs) && saving) { try { localStorage.removeItem(SAVE_KEY); } catch (err) {} }
  function load() {
    if (!saving) return;
    try { var s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s) pond.fromState(s, Date.now()); } catch (err) {}
  }
  function save() {
    if (!saving || !pond) return;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(pond.toState(Date.now()))); } catch (err) {}
  }
  setInterval(save, 5000);
  window.addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });

  function setup() {
    W = Math.max(50, window.innerWidth); H = Math.max(50, window.innerHeight);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    if (!pond) { pond = new S.Pond(W, H, seed); load(); } else pond.resize(W, H);
    wcan.width = pond.grid.w; wcan.height = pond.grid.h;
    wimg = wctx.createImageData(pond.grid.w, pond.grid.h);
    buildFloor();
  }

  /* ---------- fish ---------- */
  var FW = [0.36, 0.74, 0.95, 1.0, 0.93, 0.78, 0.58, 0.4, 0.26, 0.17];
  var NS = FW.length;
  var sxs = new Float32Array(NS), sys = new Float32Array(NS);

  function spine(f) {
    var len = f.len;
    for (var i = 0; i < NS; i++) {
      var s = i / (NS - 1);
      sxs[i] = (0.36 - s * 0.8) * len;
      sys[i] = (Math.sin(f.phase - s * 3.0) * 0.085 - f.turn * 0.035) * len * s * s;
    }
  }
  function bodyPath(f) {
    var hw = f.len * 0.13, i;
    ctx.beginPath();
    ctx.moveTo(sxs[0] + f.len * 0.075, sys[0]);
    ctx.quadraticCurveTo(sxs[0] + f.len * 0.07, sys[0] - hw * FW[0], sxs[0], sys[0] - hw * FW[0]);
    for (i = 1; i < NS; i++) ctx.lineTo(sxs[i], sys[i] - hw * FW[i]);
    for (i = NS - 1; i >= 0; i--) ctx.lineTo(sxs[i], sys[i] + hw * FW[i]);
    ctx.quadraticCurveTo(sxs[0] + f.len * 0.07, sys[0] + hw * FW[0], sxs[0] + f.len * 0.075, sys[0]);
    ctx.closePath();
  }
  function tailPath(f) {
    var len = f.len, ex = sxs[NS - 1], ey = sys[NS - 1];
    var sw = (Math.sin(f.phase - 3.9) * 0.13 - f.turn * 0.03) * len;
    var tx = ex - len * 0.26;
    ctx.beginPath();
    ctx.moveTo(ex + len * 0.03, ey - len * 0.02);
    ctx.quadraticCurveTo(ex - len * 0.1, ey - len * 0.05 + sw * 0.4, tx, ey - len * 0.12 + sw);
    ctx.quadraticCurveTo(tx + len * 0.09, ey + sw * 0.8, tx, ey + len * 0.12 + sw);
    ctx.quadraticCurveTo(ex - len * 0.1, ey + len * 0.05 + sw * 0.4, ex + len * 0.03, ey + len * 0.02);
    ctx.closePath();
  }
  function finsPath(f) {
    var len = f.len, hw = len * 0.13, i = 2;
    var flap = Math.sin(f.phase * 0.7) * 0.15;
    ctx.beginPath();
    ctx.ellipse(sxs[i] - len * 0.05, sys[i] - hw * 1.15, len * 0.1, len * 0.04, 0.75 + flap, 0, 6.2832);
    ctx.ellipse(sxs[i] - len * 0.05, sys[i] + hw * 1.15, len * 0.1, len * 0.04, -0.75 - flap, 0, 6.2832);
  }

  function drawFish(f) {
    var look = f.look, len = f.len, hw = len * 0.13, i;
    spine(f);
    // shadow on the bottom
    ctx.save();
    ctx.translate(f.x + len * 0.07, f.y + len * 0.11); ctx.rotate(f.a);
    ctx.fillStyle = 'rgba(2,6,10,0.22)';
    bodyPath(f); ctx.fill(); tailPath(f); ctx.fill();
    ctx.restore();

    var g = f.glow || 0;
    if (g > 0) {
      // a warm glow in the water around a koi that has just eaten
      var gr = len * 0.75, halo = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, gr);
      halo.addColorStop(0, 'rgba(232,200,120,' + (0.3 * g) + ')');
      halo.addColorStop(1, 'rgba(232,200,120,0)');
      ctx.fillStyle = halo; ctx.fillRect(f.x - gr, f.y - gr, 2 * gr, 2 * gr);
    }

    ctx.save();
    ctx.translate(f.x, f.y); ctx.rotate(f.a);
    if (g > 0) ctx.scale(1, 1 + 0.2 * g * g * g);       // the gulp: a moment rounder in the belly
    ctx.globalAlpha = 0.5; ctx.fillStyle = look.body;
    finsPath(f); ctx.fill();
    ctx.globalAlpha = 0.62;
    tailPath(f); ctx.fill();
    ctx.globalAlpha = 0.9;
    bodyPath(f); ctx.fill();
    ctx.save();
    ctx.clip();
    for (i = 0; i < look.spots.length; i++) {
      var sp = look.spots[i], k = Math.round(sp[0] * (NS - 1));
      ctx.fillStyle = (i === 2 && look.patch2) ? look.patch2 : look.patch;
      ctx.beginPath();
      ctx.ellipse(sxs[k], sys[k] + sp[1] * hw, len * 0.13 * sp[2], hw * 0.95 * sp[2], 0.3 * (i - 1), 0, 6.2832);
      ctx.fill();
    }
    // darker along the back, so the body reads as rounded
    ctx.globalAlpha = 0.22; ctx.strokeStyle = '#0b1216'; ctx.lineWidth = hw * 0.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sxs[2], sys[2]);
    for (i = 3; i < NS - 1; i++) ctx.lineTo(sxs[i], sys[i]);
    ctx.stroke();
    if (look.metal) {
      // metallic koi: a pearly line of light along the back
      ctx.globalAlpha = 0.3; ctx.strokeStyle = '#fff7de'; ctx.lineWidth = hw * 0.32;
      ctx.beginPath(); ctx.moveTo(sxs[1], sys[1] - hw * 0.22);
      for (i = 2; i < NS - 2; i++) ctx.lineTo(sxs[i], sys[i] - hw * 0.22);
      ctx.stroke();
    }
    if (g > 0) {
      // a golden sheen that runs from head to tail and fades
      var at = sxs[0] - (1 - g) * len * 0.9;
      var sheen = ctx.createLinearGradient(at + len * 0.3, 0, at - len * 0.3, 0);
      sheen.addColorStop(0, 'rgba(255,236,180,0)');
      sheen.addColorStop(0.5, 'rgba(255,236,180,' + (0.55 * g) + ')');
      sheen.addColorStop(1, 'rgba(255,236,180,0)');
      ctx.globalAlpha = 1; ctx.fillStyle = sheen;
      ctx.fillRect(sxs[NS - 1] - len * 0.4, -hw * 2, len * 1.6, hw * 4);
    }
    ctx.restore();
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#0c1014';
    ctx.beginPath();
    ctx.arc(sxs[0] + len * 0.01, sys[0] - hw * 0.34, len * 0.014, 0, 6.2832);
    ctx.arc(sxs[0] + len * 0.01, sys[0] + hw * 0.34, len * 0.014, 0, 6.2832);
    ctx.fill();
    ctx.restore();
  }

  /* ---------- lily pads ---------- */
  var PAD_TONES = [['#48684b', '#34503c'], ['#516f4a', '#3a5539'], ['#43624f', '#30493d']];
  function drawPad(p) {
    if (S.isCrop(p.kind)) { drawCrop(p); return; }
    var r = p.r, tone = PAD_TONES[p.tone];
    var tx = clamp(p.tx, -0.6, 0.6), ty = clamp(p.ty, -0.6, 0.6);
    var bob = clamp(p.bob, -1.2, 1.2);
    var tm = Math.hypot(tx, ty), ta = Math.atan2(ty, tx);
    var squash = 1 - Math.min(0.16, tm * 0.45);
    var x = p.x - tx * r * 0.35, y = p.y - ty * r * 0.35;
    var sc = 1 + bob * 0.045;

    ctx.save();
    ctx.translate(x + 3 + bob * 2.5, y + 5 + bob * 3.5);
    ctx.rotate(p.rot); ctx.fillStyle = 'rgba(2,6,10,0.3)';
    padShape(r * 1.02); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ta); ctx.scale(squash * sc, sc); ctx.rotate(-ta);
    ctx.rotate(p.rot);
    var g = ctx.createRadialGradient(-r * 0.2, -r * 0.25, r * 0.1, 0, 0, r);
    g.addColorStop(0, tone[0]); g.addColorStop(1, tone[1]);
    ctx.fillStyle = g; padShape(r); ctx.fill();
    ctx.strokeStyle = 'rgba(190,210,170,0.16)'; ctx.lineWidth = 1;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(200,215,180,0.11)';
    ctx.beginPath();
    for (var i = 0; i < 9; i++) {
      var a = 0.5 + i * (6.2832 - 1.0) / 8;
      ctx.moveTo(Math.cos(a) * r * 0.1, Math.sin(a) * r * 0.1);
      ctx.lineTo(Math.cos(a) * r * 0.9, Math.sin(a) * r * 0.9);
    }
    ctx.stroke();
    if (p.flower) drawFlower(r, p.flower);
    ctx.restore();

    // the lit / shaded side as the pad tilts
    var lit = -(tx * 0.6 + ty * 0.8);
    if (Math.abs(lit) > 0.01) {
      ctx.save();
      ctx.translate(x, y); ctx.rotate(p.rot);
      ctx.fillStyle = lit > 0 ? 'rgba(4,10,12,' + Math.min(0.3, lit * 0.9) + ')' : 'rgba(215,230,205,' + Math.min(0.2, -lit * 0.6) + ')';
      padShape(r * sc); ctx.fill();
      ctx.restore();
    }
  }
  function padShape(r) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, 0.22, 6.2832 - 0.22);
    ctx.closePath();
  }
  function drawFlower(r, colors) {
    var pr = r * 0.34, i, a;
    ctx.save();
    ctx.translate(-r * 0.3, r * 0.22);
    for (var ring = 0; ring < 2; ring++) {
      ctx.fillStyle = colors[ring];
      var n = ring ? 6 : 8, rr = pr * (ring ? 0.68 : 1);
      for (i = 0; i < n; i++) {
        a = i * 6.2832 / n + ring * 0.4;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * rr * 0.5, Math.sin(a) * rr * 0.5, rr * 0.55, rr * 0.24, a, 0, 6.2832);
        ctx.fill();
      }
    }
    ctx.fillStyle = '#c9a85c';
    ctx.beginPath(); ctx.arc(0, 0, pr * 0.17, 0, 6.2832); ctx.fill();
    ctx.restore();
  }
  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  /* ---------- crops ----------
     Each crop is drawn by one function, twice: once flat in shadow colour for its shadow on the
     bottom, then in colour. g is how ripe it is, 0..1; the plant reaches full size at 80%. */
  var SHADOW = 'rgba(2,6,10,0.3)';
  function drawCrop(p) {
    var g = S.ripeness(p), ripe = g >= 1;
    var r = p.r * (0.5 + 0.5 * Math.min(1, g * 1.25));
    var bob = clamp(p.bob, -1.2, 1.2), sc = 1 + bob * 0.045;
    var x = p.x - clamp(p.tx, -0.6, 0.6) * r * 0.35, y = p.y - clamp(p.ty, -0.6, 0.6) * r * 0.35;
    var draw = p.kind === 'cress' ? cressShape : p.kind === 'chestnut' ? chestnutShape : lotusShape;
    if (ripe) {
      // a ripe crop glows softly, so you can see from across the water what is ready to pick
      var t = performance.now() / 1000, pulse = 0.5 + 0.5 * Math.sin(t * 2.4 + p.rot * 3), hr = r * (1.35 + 0.08 * pulse);
      var halo = ctx.createRadialGradient(x, y, r * 0.5, x, y, hr);
      halo.addColorStop(0, 'rgba(240,206,120,' + (0.2 + 0.12 * pulse) + ')'); halo.addColorStop(1, 'rgba(240,206,120,0)');
      ctx.fillStyle = halo; ctx.fillRect(x - hr, y - hr, 2 * hr, 2 * hr);
    }
    ctx.save();
    ctx.translate(x + 3 + bob * 2.5, y + 5 + bob * 3.5); ctx.scale(sc, sc); ctx.rotate(p.rot);
    draw(r, g, true);
    ctx.restore();
    ctx.save();
    ctx.translate(x, y); ctx.scale(sc, sc); ctx.rotate(p.rot);
    draw(r, g, false);
    ctx.restore();
  }

  // watercress: a floating mat of small round leaflets that thickens as it grows, with white flowers when ripe
  function cressShape(r, g, shadow) {
    var N = 18, n = Math.round(7 + 11 * Math.min(1, g * 1.25)), i, a, d, lr, cx, cy;
    var greens = ['#5e8c46', '#6f9d50', '#4f7d3d'];
    for (i = 0; i < n; i++) {
      a = i * 2.39996; d = r * 0.78 * Math.sqrt((i + 0.5) / N); lr = r * (0.24 - 0.08 * d / r);
      cx = Math.cos(a) * d; cy = Math.sin(a) * d;
      ctx.fillStyle = shadow ? SHADOW : greens[i % 3];
      ctx.beginPath(); ctx.ellipse(cx, cy, lr, lr * 0.82, a, 0, 6.2832); ctx.fill();
      if (!shadow) {
        ctx.fillStyle = 'rgba(220,240,190,0.16)';
        ctx.beginPath(); ctx.ellipse(cx - lr * 0.3, cy - lr * 0.3, lr * 0.4, lr * 0.28, a, 0, 6.2832); ctx.fill();
      }
    }
    if (shadow || g < 1) return;
    ctx.fillStyle = '#f1f1e4';
    for (i = 0; i < 6; i++) {
      a = i * 2.2 + 0.6; d = r * (0.25 + 0.12 * (i % 3));
      cx = Math.cos(a) * d; cy = Math.sin(a) * d;
      for (var k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(cx + Math.cos(k * 1.57) * r * 0.05, cy + Math.sin(k * 1.57) * r * 0.05, r * 0.035, 0, 6.2832); ctx.fill(); }
    }
  }

  // water chestnut: a rosette of diamond leaves; when ripe, dark horned nuts show between the outer leaves
  function chestnutShape(r, g, shadow) {
    var i, a, outer = g > 0.3;
    function leaf(a, d0, d1, w, col) {
      var dm = (d0 + d1) * 0.55, c = Math.cos(a), s = Math.sin(a);
      ctx.fillStyle = shadow ? SHADOW : col;
      ctx.beginPath();
      ctx.moveTo(c * d0, s * d0);
      ctx.lineTo(c * dm - s * w, s * dm + c * w);
      ctx.lineTo(c * d1, s * d1);
      ctx.lineTo(c * dm + s * w, s * dm - c * w);
      ctx.closePath(); ctx.fill();
      if (!shadow) { ctx.strokeStyle = 'rgba(200,220,160,0.22)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(c * d0, s * d0); ctx.lineTo(c * d1 * 0.92, s * d1 * 0.92); ctx.stroke(); }
    }
    if (outer) for (i = 0; i < 9; i++) leaf(i * 0.698, r * 0.25, r, r * 0.24, i % 2 ? '#4d6b3d' : '#557444');
    for (i = 0; i < 6; i++) leaf(i * 1.047 + 0.35, r * 0.04, r * 0.62, r * 0.2, i % 2 ? '#5f8049' : '#688a50');
    if (!shadow) { ctx.fillStyle = '#7a4a38'; ctx.beginPath(); ctx.arc(0, 0, r * 0.09, 0, 6.2832); ctx.fill(); }
    if (g < 1) return;
    for (i = 0; i < 3; i++) {
      a = i * 2.094 + 0.35; var nx = Math.cos(a) * r * 0.72, ny = Math.sin(a) * r * 0.72;
      drawProduceAt('chestnut', nx, ny, r * 0.34, a + 1.57, shadow);
    }
  }

  // lotus: one big round leaf; mid-way a pink flower opens beside it, and when ripe the flower is a seed pod
  function lotusShape(r, g, shadow) {
    var i;
    ctx.fillStyle = SHADOW;
    if (!shadow) {
      var lg = ctx.createRadialGradient(-r * 0.25, -r * 0.3, r * 0.1, 0, 0, r);
      lg.addColorStop(0, '#71946d'); lg.addColorStop(1, '#46685a'); ctx.fillStyle = lg;
    }
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fill();
    if (!shadow) {
      ctx.strokeStyle = 'rgba(210,230,200,0.17)'; ctx.lineWidth = 1; ctx.beginPath();
      for (i = 0; i < 13; i++) { var a = i * 0.4833; ctx.moveTo(Math.cos(a) * r * 0.08, Math.sin(a) * r * 0.08); ctx.lineTo(Math.cos(a) * r * 0.94, Math.sin(a) * r * 0.94); }
      ctx.stroke();
      ctx.fillStyle = 'rgba(225,240,215,0.28)'; ctx.beginPath(); ctx.arc(0, 0, r * 0.07, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(235,245,230,0.1)'; ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.4, r * 0.35, r * 0.18, -0.6, 0, 6.2832); ctx.fill();
    }
    if (g < 0.45) return;
    var fx = r * 0.78, fy = -r * 0.5;
    if (g >= 1) { drawProduceAt('lotus', fx, fy, r * 0.62, 0.4, shadow); return; }
    // the flower: a bud that opens as the pod ripens inside it
    var open = Math.min(1, (g - 0.45) / 0.35), pr = r * (0.18 + 0.2 * open);
    for (var ring = 0; ring < 2; ring++) {
      var n = ring ? 6 : 8, rr = pr * (ring ? 0.62 : 1);
      ctx.fillStyle = shadow ? SHADOW : ring ? '#f4d6dd' : '#df9db0';
      for (i = 0; i < n; i++) {
        var pa = i * 6.2832 / n + ring * 0.4;
        ctx.beginPath(); ctx.ellipse(fx + Math.cos(pa) * rr * 0.5 * open, fy + Math.sin(pa) * rr * 0.5 * open, rr * 0.56, rr * 0.3, pa, 0, 6.2832); ctx.fill();
      }
    }
    if (!shadow) { ctx.fillStyle = '#d8c25e'; ctx.beginPath(); ctx.arc(fx, fy, pr * 0.22, 0, 6.2832); ctx.fill(); }
  }

  /* One piece of produce, centred at (x, y), s across. Used on the plants and in the shop's baskets. */
  function drawProduceAt(kind, x, y, s, rot, shadow) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0);
    var h = s / 2, i;
    if (kind === 'chestnut') {
      // a dark nut with two curved horns
      ctx.strokeStyle = shadow ? SHADOW : '#2c1f18'; ctx.lineWidth = Math.max(1, s * 0.11); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-h * 0.55, 0); ctx.quadraticCurveTo(-h * 1.05, -h * 0.1, -h * 1.0, -h * 0.55);
      ctx.moveTo(h * 0.55, 0); ctx.quadraticCurveTo(h * 1.05, -h * 0.1, h * 1.0, -h * 0.55); ctx.stroke();
      ctx.fillStyle = shadow ? SHADOW : '#3d2a1f';
      ctx.beginPath(); ctx.ellipse(0, h * 0.05, h * 0.62, h * 0.5, 0, 0, 6.2832); ctx.fill();
      if (!shadow) { ctx.fillStyle = 'rgba(230,200,170,0.28)'; ctx.beginPath(); ctx.ellipse(-h * 0.2, -h * 0.12, h * 0.22, h * 0.13, -0.4, 0, 6.2832); ctx.fill(); }
    } else if (kind === 'lotus') {
      // a seed pod seen from above: a flat-topped disc dotted with seed holes
      ctx.fillStyle = shadow ? SHADOW : '#9c914f';
      if (!shadow) { var pg = ctx.createRadialGradient(-h * 0.3, -h * 0.3, h * 0.1, 0, 0, h); pg.addColorStop(0, '#b6ab66'); pg.addColorStop(1, '#7c7238'); ctx.fillStyle = pg; }
      ctx.beginPath(); ctx.arc(0, 0, h, 0, 6.2832); ctx.fill();
      if (!shadow) {
        ctx.fillStyle = '#463f1d';
        ctx.beginPath(); ctx.arc(0, 0, h * 0.13, 0, 6.2832); ctx.fill();
        for (i = 0; i < 7; i++) { var a = i * 0.8976; ctx.beginPath(); ctx.arc(Math.cos(a) * h * 0.58, Math.sin(a) * h * 0.58, h * 0.12, 0, 6.2832); ctx.fill(); }
      }
    } else {
      // a bunch of watercress tied with a pale band
      var greens = ['#5e8c46', '#73a253', '#517f3f'];
      for (i = 0; i < 7; i++) {
        var la = i * 2.4, ld = h * 0.55 * Math.sqrt((i + 0.5) / 7);
        ctx.fillStyle = shadow ? SHADOW : greens[i % 3];
        ctx.beginPath(); ctx.arc(Math.cos(la) * ld, Math.sin(la) * ld - h * 0.2, h * 0.36, 0, 6.2832); ctx.fill();
      }
      ctx.fillStyle = shadow ? SHADOW : '#5a7a3e'; ctx.fillRect(-h * 0.16, h * 0.15, h * 0.32, h * 0.8);
      if (!shadow) { ctx.fillStyle = '#e8dcc0'; ctx.fillRect(-h * 0.24, h * 0.35, h * 0.48, h * 0.16); }
    }
    ctx.restore();
  }

  // "+2 lotus pods" rising from a harvest
  function drawPops() {
    var pops = pond.pops;
    for (var i = 0; i < pops.length; i++) {
      var p = pops[i], t = p.age / 1.8, y = p.y - 34 * Math.sqrt(t), a = t < 0.65 ? 1 : 1 - (t - 0.65) / 0.35;
      var P = S.PRODUCE[p.kind], text = '+' + p.n + ' ' + (p.n === 1 ? P.one : P.many);
      ctx.globalAlpha = a;
      ctx.font = 'bold 17px Georgia, "Iowan Old Style", serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      var w = ctx.measureText(text).width, x = p.x - (w + 26) / 2;
      drawProduceAt(p.kind, x + 10, y, 18, 0, false);
      ctx.lineJoin = 'round'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,12,6,0.85)';
      ctx.strokeText(text, x + 24, y); ctx.fillStyle = '#f3e3bd'; ctx.fillText(text, x + 24, y);
    }
    ctx.globalAlpha = 1;
  }

  // the shop draws its koi and plants with the same brushes, on its own canvases
  function withCtx(c, fn, arg) { var keep = ctx; ctx = c; try { fn(arg); } finally { ctx = keep; } }
  window.KoiDraw = {
    fish: function (c, f) { withCtx(c, drawFish, f); },
    pad: function (c, p) { withCtx(c, drawPad, p); },
    produce: function (c, kind, x, y, s, rot) { withCtx(c, function () { drawProduceAt(kind, x, y, s, rot, false); }); }
  };

  /* ---------- food ---------- */
  function drawFood() {
    var food = pond.food, r0 = clamp(pond.fishBase * 0.05, 2.6, 4.6), i, p, r, a, land, sink;
    for (i = 0; i < food.length; i++) {
      p = food[i];
      land = Math.min(1, p.age / 0.25);                         // a pellet lands with a little pop
      sink = p.age > p.life ? 1 - (p.age - p.life) / S.SINK : 1;
      r = r0 * p.size * (0.7 + 0.3 * land) * (0.6 + 0.4 * sink);
      a = clamp(sink, 0, 1);
      ctx.globalAlpha = 0.35 * a; ctx.fillStyle = '#02060a';
      ctx.beginPath(); ctx.ellipse(p.x + r * 0.5, p.y + r * 0.9, r * 1.05, r * 0.95, p.rot, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = a; ctx.fillStyle = sink < 1 ? '#5e4430' : '#93643a';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, r, r * 0.86, p.rot, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 0.55 * a; ctx.fillStyle = '#d7b07a';
      ctx.beginPath(); ctx.arc(p.x - r * 0.32, p.y - r * 0.34, r * 0.36, 0, 6.2832); ctx.fill();
    }
    // golden motes where a koi has just eaten
    var sparks = pond.sparks;
    ctx.fillStyle = '#f0d690';
    for (i = 0; i < sparks.length; i++) {
      var s = sparks[i], t = s.age / s.life;
      ctx.globalAlpha = (1 - t) * (1 - t) * 0.9;
      ctx.beginPath(); ctx.arc(s.x, s.y, 1.1 + 1.6 * (1 - t), 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- frame ---------- */
  function render() {
    var i;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.drawImage(floor, 0, 0, W, H);
    for (i = 0; i < pond.fish.length; i++) drawFish(pond.fish[i]);
    // a veil of water over the fish so they sit under the surface
    ctx.fillStyle = 'rgba(20,46,52,0.2)'; ctx.fillRect(0, 0, W, H);
    S.shade(pond.grid, wimg.data);
    wctx.putImageData(wimg, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(wcan, 0, 0, W, H);
    drawFood();
    for (i = 0; i < pond.pads.length; i++) drawPad(pond.pads[i]);
    drawPops();
  }

  var raf = 0, last = 0, acc = 0;
  function frame(t) {
    raf = requestAnimationFrame(frame);
    var dt = Math.min(0.1, (t - last) / 1000); last = t;
    acc += dt;
    var n = 0;
    while (acc >= S.DT && n < 4) { pond.step(); acc -= S.DT; n++; }
    if (acc > S.DT) acc = 0;
    render();
  }
  function start() { if (!raf && !document.hidden) { last = performance.now(); acc = 0; raf = requestAnimationFrame(frame); } }
  function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
  // crops keep ripening while the page is in the background, even though the water stops
  var hiddenAt = 0;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stop(); hiddenAt = Date.now(); }
    else { if (hiddenAt) pond.ripen((Date.now() - hiddenAt) / 1000); hiddenAt = 0; start(); }
  });

  /* ---------- input ---------- */
  // a tap scatters a pinch of food; a drag draws a wake through the water.
  // A touch only counts as a drag once it has moved past SLOP, so a slightly shaky tap still feeds.
  var SLOP = 8;
  var pointers = {};
  function pos(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var p = pos(e);
    pointers[e.pointerId] = { x0: p.x, y0: p.y, x: p.x, y: p.y, drag: false };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', function (e) {
    var q = pointers[e.pointerId];
    if (!q) return;
    e.preventDefault();
    var p = pos(e);
    if (!q.drag) {
      if (Math.hypot(p.x - q.x0, p.y - q.y0) < SLOP) return;
      q.drag = true;
      hd.className = 'poked';
    }
    if (Math.abs(p.x - q.x) + Math.abs(p.y - q.y) < 1) return;
    pond.wake(q.x, q.y, p.x, p.y);
    q.x = p.x; q.y = p.y;
  });
  canvas.addEventListener('pointerup', function (e) {
    var q = pointers[e.pointerId];
    delete pointers[e.pointerId];
    if (!q || q.drag) return;
    // a tap on a ripe crop picks it; anywhere else it scatters food
    if (pond.harvestAt(q.x0, q.y0)) { window.dispatchEvent(new Event('koi:change')); save(); }
    else pond.feed(q.x0, q.y0);
    hd.className = 'poked';
  });
  canvas.addEventListener('pointercancel', function (e) { delete pointers[e.pointerId]; });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  var rt = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { pointers = {}; setup(); render(); }, 80);
  });

  setup();
  window.KoiGame = { pond: function () { return pond; }, save: save };
  if (demo) {
    // test-only: fixed pebbles, stepped synchronously so a screenshot has something to show
    var drops = [[0, 0.36, 0.46], [45, 0.63, 0.58], [100, 0.52, 0.27], [150, 0.2, 0.75]];
    for (var s = 0; s < 190; s++) {
      for (var d = 0; d < drops.length; d++) if (drops[d][0] === s) pond.poke(W * drops[d][1], H * drops[d][2], 1);
      if (s === 165) pond.wake(W * 0.72, H * 0.2, W * 0.8, H * 0.3);
      if (s === 175) pond.wake(W * 0.8, H * 0.3, W * 0.86, H * 0.42);
      pond.step();
    }
    window.__pond = pond;
  }
  render();
  start();
})();
</script>

</body>
