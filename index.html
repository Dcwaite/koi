<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Koi</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14171f; color: #e9e4d8;
    font: 15px/1.5 Georgia, "Iowan Old Style", serif; }
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; cursor: pointer; }
  header { position: fixed; left: 24px; top: 20px; pointer-events: none; -webkit-user-select: none; user-select: none; }
  header p { margin: 0; color: #a59f90; transition: opacity 2.5s ease; }
  header.poked p { opacity: 0; }
  #feed { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); width: 56px; height: 56px; margin-left: -28px;
    padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;
    color: #c9c3b4; background: rgba(16,22,30,0.55); border: 1px solid rgba(233,228,216,0.18);
    box-shadow: 0 6px 22px rgba(0,0,0,0.3); -webkit-tap-highlight-color: transparent; transition: background 0.2s, border-color 0.2s, color 0.2s; }
  #feed svg { width: 26px; height: 26px; fill: currentColor; }
  #feed:hover { background: rgba(30,38,48,0.7); color: #e9e4d8; }
  #feed[aria-pressed="true"] { color: #e8cd82; background: rgba(60,48,20,0.75); border-color: #c9a85c; }
  #feed:focus-visible { outline: 2px solid #c9a85c; outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<header id="hd"><p id="hint">touch the water.</p></header>
<button id="feed" type="button" aria-pressed="false" aria-label="Feed the koi" title="Feed the koi (F)">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="9" r="2.4"/><circle cx="15.5" cy="7.5" r="2"/><circle cx="12" cy="15" r="2.6"/><circle cx="18" cy="14.5" r="1.7"/><circle cx="6.5" cy="16.5" r="1.5"/></svg>
</button>
<script src="pond.js"></script>
<script>
(function () {
  'use strict';
  var S = window.PondSim;
  var canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var hd = document.getElementById('hd');
  var qs = location.search;
  var demo = /[?&]demo=1/.test(qs);
  var seedM = /[?&]seed=(\d+)/.exec(qs);
  var seed = seedM ? +seedM[1] : demo ? 7 : (Math.random() * 4294967296) >>> 0;

  var W = 0, H = 0, dpr = 1, pond = null;
  var wcan = document.createElement('canvas'), wctx = wcan.getContext('2d'), wimg = null;
  var floor = document.createElement('canvas');

  function buildFloor() {
    floor.width = Math.max(1, Math.round(W)); floor.height = Math.max(1, Math.round(H));
    var f = floor.getContext('2d'), rng = S.mulberry32(11), i;
    var R = Math.hypot(W, H) * 0.62;
    var g = f.createRadialGradient(W * 0.46, H * 0.44, 0, W * 0.5, H * 0.5, R);
    g.addColorStop(0, '#1d3a3d'); g.addColorStop(0.55, '#162c33'); g.addColorStop(1, '#0e1a22');
    f.fillStyle = g; f.fillRect(0, 0, W, H);
    // soft mottling so still water is not one flat gradient
    for (i = 0; i < 46; i++) {
      var x = rng() * W, y = rng() * H, r = (0.05 + rng() * 0.16) * Math.min(W, H);
      var light = rng() < 0.45;
      var b = f.createRadialGradient(x, y, 0, x, y, r);
      b.addColorStop(0, light ? 'rgba(70,110,104,0.10)' : 'rgba(6,12,18,0.16)');
      b.addColorStop(1, light ? 'rgba(70,110,104,0)' : 'rgba(6,12,18,0)');
      f.fillStyle = b; f.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
    // a few stones on the bottom, barely there
    for (i = 0; i < 70; i++) {
      var sx = rng() * W, sy = rng() * H, sr = 2 + rng() * 6;
      f.fillStyle = rng() < 0.5 ? 'rgba(120,140,130,0.07)' : 'rgba(0,0,0,0.12)';
      f.beginPath(); f.ellipse(sx, sy, sr, sr * (0.6 + rng() * 0.4), rng() * 3.14, 0, 6.2832); f.fill();
    }
  }

  function setup() {
    W = Math.max(50, window.innerWidth); H = Math.max(50, window.innerHeight);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    if (!pond) pond = new S.Pond(W, H, seed); else pond.resize(W, H);
    wcan.width = pond.grid.w; wcan.height = pond.grid.h;
    wimg = wctx.createImageData(pond.grid.w, pond.grid.h);
    buildFloor();
  }

  /* ---------- fish ---------- */
  var FW = [0.36, 0.74, 0.95, 1.0, 0.93, 0.78, 0.58, 0.4, 0.26, 0.17];
  var NS = FW.length;
  var sxs = new Float32Array(NS), sys = new Float32Array(NS);

  function spine(f) {
    var len = f.len;
    for (var i = 0; i < NS; i++) {
      var s = i / (NS - 1);
      sxs[i] = (0.36 - s * 0.8) * len;
      sys[i] = (Math.sin(f.phase - s * 3.0) * 0.085 - f.turn * 0.035) * len * s * s;
    }
  }
  function bodyPath(f) {
    var hw = f.len * 0.13, i;
    ctx.beginPath();
    ctx.moveTo(sxs[0] + f.len * 0.075, sys[0]);
    ctx.quadraticCurveTo(sxs[0] + f.len * 0.07, sys[0] - hw * FW[0], sxs[0], sys[0] - hw * FW[0]);
    for (i = 1; i < NS; i++) ctx.lineTo(sxs[i], sys[i] - hw * FW[i]);
    for (i = NS - 1; i >= 0; i--) ctx.lineTo(sxs[i], sys[i] + hw * FW[i]);
    ctx.quadraticCurveTo(sxs[0] + f.len * 0.07, sys[0] + hw * FW[0], sxs[0] + f.len * 0.075, sys[0]);
    ctx.closePath();
  }
  function tailPath(f) {
    var len = f.len, ex = sxs[NS - 1], ey = sys[NS - 1];
    var sw = (Math.sin(f.phase - 3.9) * 0.13 - f.turn * 0.03) * len;
    var tx = ex - len * 0.26;
    ctx.beginPath();
    ctx.moveTo(ex + len * 0.03, ey - len * 0.02);
    ctx.quadraticCurveTo(ex - len * 0.1, ey - len * 0.05 + sw * 0.4, tx, ey - len * 0.12 + sw);
    ctx.quadraticCurveTo(tx + len * 0.09, ey + sw * 0.8, tx, ey + len * 0.12 + sw);
    ctx.quadraticCurveTo(ex - len * 0.1, ey + len * 0.05 + sw * 0.4, ex + len * 0.03, ey + len * 0.02);
    ctx.closePath();
  }
  function finsPath(f) {
    var len = f.len, hw = len * 0.13, i = 2;
    var flap = Math.sin(f.phase * 0.7) * 0.15;
    ctx.beginPath();
    ctx.ellipse(sxs[i] - len * 0.05, sys[i] - hw * 1.15, len * 0.1, len * 0.04, 0.75 + flap, 0, 6.2832);
    ctx.ellipse(sxs[i] - len * 0.05, sys[i] + hw * 1.15, len * 0.1, len * 0.04, -0.75 - flap, 0, 6.2832);
  }

  function drawFish(f) {
    var look = f.look, len = f.len, hw = len * 0.13, i;
    spine(f);
    // shadow on the bottom
    ctx.save();
    ctx.translate(f.x + len * 0.07, f.y + len * 0.11); ctx.rotate(f.a);
    ctx.fillStyle = 'rgba(2,6,10,0.22)';
    bodyPath(f); ctx.fill(); tailPath(f); ctx.fill();
    ctx.restore();

    var g = f.glow || 0;
    if (g > 0) {
      // a warm glow in the water around a koi that has just eaten
      var gr = len * 0.75, halo = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, gr);
      halo.addColorStop(0, 'rgba(232,200,120,' + (0.3 * g) + ')');
      halo.addColorStop(1, 'rgba(232,200,120,0)');
      ctx.fillStyle = halo; ctx.fillRect(f.x - gr, f.y - gr, 2 * gr, 2 * gr);
    }

    ctx.save();
    ctx.translate(f.x, f.y); ctx.rotate(f.a);
    if (g > 0) ctx.scale(1, 1 + 0.2 * g * g * g);       // the gulp: a moment rounder in the belly
    ctx.globalAlpha = 0.5; ctx.fillStyle = look.body;
    finsPath(f); ctx.fill();
    ctx.globalAlpha = 0.62;
    tailPath(f); ctx.fill();
    ctx.globalAlpha = 0.9;
    bodyPath(f); ctx.fill();
    ctx.save();
    ctx.clip();
    for (i = 0; i < look.spots.length; i++) {
      var sp = look.spots[i], k = Math.round(sp[0] * (NS - 1));
      ctx.fillStyle = (i === 2 && look.patch2) ? look.patch2 : look.patch;
      ctx.beginPath();
      ctx.ellipse(sxs[k], sys[k] + sp[1] * hw, len * 0.13 * sp[2], hw * 0.95 * sp[2], 0.3 * (i - 1), 0, 6.2832);
      ctx.fill();
    }
    // darker along the back, so the body reads as rounded
    ctx.globalAlpha = 0.22; ctx.strokeStyle = '#0b1216'; ctx.lineWidth = hw * 0.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sxs[2], sys[2]);
    for (i = 3; i < NS - 1; i++) ctx.lineTo(sxs[i], sys[i]);
    ctx.stroke();
    if (g > 0) {
      // a golden sheen that runs from head to tail and fades
      var at = sxs[0] - (1 - g) * len * 0.9;
      var sheen = ctx.createLinearGradient(at + len * 0.3, 0, at - len * 0.3, 0);
      sheen.addColorStop(0, 'rgba(255,236,180,0)');
      sheen.addColorStop(0.5, 'rgba(255,236,180,' + (0.55 * g) + ')');
      sheen.addColorStop(1, 'rgba(255,236,180,0)');
      ctx.globalAlpha = 1; ctx.fillStyle = sheen;
      ctx.fillRect(sxs[NS - 1] - len * 0.4, -hw * 2, len * 1.6, hw * 4);
    }
    ctx.restore();
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#0c1014';
    ctx.beginPath();
    ctx.arc(sxs[0] + len * 0.01, sys[0] - hw * 0.34, len * 0.014, 0, 6.2832);
    ctx.arc(sxs[0] + len * 0.01, sys[0] + hw * 0.34, len * 0.014, 0, 6.2832);
    ctx.fill();
    ctx.restore();
  }

  /* ---------- lily pads ---------- */
  var PAD_TONES = [['#48684b', '#34503c'], ['#516f4a', '#3a5539'], ['#43624f', '#30493d']];
  function drawPad(p) {
    var r = p.r, tone = PAD_TONES[p.tone];
    var tx = clamp(p.tx, -0.6, 0.6), ty = clamp(p.ty, -0.6, 0.6);
    var bob = clamp(p.bob, -1.2, 1.2);
    var tm = Math.hypot(tx, ty), ta = Math.atan2(ty, tx);
    var squash = 1 - Math.min(0.16, tm * 0.45);
    var x = p.x - tx * r * 0.35, y = p.y - ty * r * 0.35;
    var sc = 1 + bob * 0.045;

    ctx.save();
    ctx.translate(x + 3 + bob * 2.5, y + 5 + bob * 3.5);
    ctx.rotate(p.rot); ctx.fillStyle = 'rgba(2,6,10,0.3)';
    padShape(r * 1.02); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ta); ctx.scale(squash * sc, sc); ctx.rotate(-ta);
    ctx.rotate(p.rot);
    var g = ctx.createRadialGradient(-r * 0.2, -r * 0.25, r * 0.1, 0, 0, r);
    g.addColorStop(0, tone[0]); g.addColorStop(1, tone[1]);
    ctx.fillStyle = g; padShape(r); ctx.fill();
    ctx.strokeStyle = 'rgba(190,210,170,0.16)'; ctx.lineWidth = 1;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(200,215,180,0.11)';
    ctx.beginPath();
    for (var i = 0; i < 9; i++) {
      var a = 0.5 + i * (6.2832 - 1.0) / 8;
      ctx.moveTo(Math.cos(a) * r * 0.1, Math.sin(a) * r * 0.1);
      ctx.lineTo(Math.cos(a) * r * 0.9, Math.sin(a) * r * 0.9);
    }
    ctx.stroke();
    if (p.flower) drawFlower(r);
    ctx.restore();

    // the lit / shaded side as the pad tilts
    var lit = -(tx * 0.6 + ty * 0.8);
    if (Math.abs(lit) > 0.01) {
      ctx.save();
      ctx.translate(x, y); ctx.rotate(p.rot);
      ctx.fillStyle = lit > 0 ? 'rgba(4,10,12,' + Math.min(0.3, lit * 0.9) + ')' : 'rgba(215,230,205,' + Math.min(0.2, -lit * 0.6) + ')';
      padShape(r * sc); ctx.fill();
      ctx.restore();
    }
  }
  function padShape(r) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, 0.22, 6.2832 - 0.22);
    ctx.closePath();
  }
  function drawFlower(r) {
    var pr = r * 0.34, i, a;
    ctx.save();
    ctx.translate(-r * 0.3, r * 0.22);
    for (var ring = 0; ring < 2; ring++) {
      ctx.fillStyle = ring ? '#e3d9cd' : '#cdb9b4';
      var n = ring ? 6 : 8, rr = pr * (ring ? 0.68 : 1);
      for (i = 0; i < n; i++) {
        a = i * 6.2832 / n + ring * 0.4;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * rr * 0.5, Math.sin(a) * rr * 0.5, rr * 0.55, rr * 0.24, a, 0, 6.2832);
        ctx.fill();
      }
    }
    ctx.fillStyle = '#c9a85c';
    ctx.beginPath(); ctx.arc(0, 0, pr * 0.17, 0, 6.2832); ctx.fill();
    ctx.restore();
  }
  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  /* ---------- food ---------- */
  function drawFood() {
    var food = pond.food, r0 = clamp(pond.fishBase * 0.05, 2.6, 4.6), i, p, r, a, land, sink;
    for (i = 0; i < food.length; i++) {
      p = food[i];
      land = Math.min(1, p.age / 0.25);                         // a pellet lands with a little pop
      sink = p.age > p.life ? 1 - (p.age - p.life) / S.SINK : 1;
      r = r0 * p.size * (0.7 + 0.3 * land) * (0.6 + 0.4 * sink);
      a = clamp(sink, 0, 1);
      ctx.globalAlpha = 0.35 * a; ctx.fillStyle = '#02060a';
      ctx.beginPath(); ctx.ellipse(p.x + r * 0.5, p.y + r * 0.9, r * 1.05, r * 0.95, p.rot, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = a; ctx.fillStyle = sink < 1 ? '#5e4430' : '#93643a';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, r, r * 0.86, p.rot, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 0.55 * a; ctx.fillStyle = '#d7b07a';
      ctx.beginPath(); ctx.arc(p.x - r * 0.32, p.y - r * 0.34, r * 0.36, 0, 6.2832); ctx.fill();
    }
    // golden motes where a koi has just eaten
    var sparks = pond.sparks;
    ctx.fillStyle = '#f0d690';
    for (i = 0; i < sparks.length; i++) {
      var s = sparks[i], t = s.age / s.life;
      ctx.globalAlpha = (1 - t) * (1 - t) * 0.9;
      ctx.beginPath(); ctx.arc(s.x, s.y, 1.1 + 1.6 * (1 - t), 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- frame ---------- */
  function render() {
    var i;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.drawImage(floor, 0, 0, W, H);
    for (i = 0; i < pond.fish.length; i++) drawFish(pond.fish[i]);
    // a veil of water over the fish so they sit under the surface
    ctx.fillStyle = 'rgba(20,46,52,0.2)'; ctx.fillRect(0, 0, W, H);
    S.shade(pond.grid, wimg.data);
    wctx.putImageData(wimg, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(wcan, 0, 0, W, H);
    drawFood();
    for (i = 0; i < pond.pads.length; i++) drawPad(pond.pads[i]);
  }

  var raf = 0, last = 0, acc = 0;
  function frame(t) {
    raf = requestAnimationFrame(frame);
    var dt = Math.min(0.1, (t - last) / 1000); last = t;
    acc += dt;
    var n = 0;
    while (acc >= S.DT && n < 4) { pond.step(); acc -= S.DT; n++; }
    if (acc > S.DT) acc = 0;
    render();
  }
  function start() { if (!raf && !document.hidden) { last = performance.now(); acc = 0; raf = requestAnimationFrame(frame); } }
  function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else start(); });

  /* ---------- input ---------- */
  // two hands: a pebble (tap for ripples, drag for a wake) and food (tap to scatter a pinch, drag to sprinkle)
  var feedBtn = document.getElementById('feed'), hint = document.getElementById('hint');
  var feeding = false;
  function setFeeding(on) {
    feeding = on;
    feedBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    hint.textContent = on ? 'tap to scatter food.' : 'touch the water.';
    hd.className = '';
  }
  feedBtn.addEventListener('click', function () { setFeeding(!feeding); });
  window.addEventListener('keydown', function (e) {
    if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey) setFeeding(!feeding);
  });

  var pointers = {};
  function pos(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var p = pos(e);
    p.trail = 0; p.sprinkled = 0;
    pointers[e.pointerId] = p;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    if (feeding) pond.feed(p.x, p.y);
    else pond.poke(p.x, p.y, 1);
    hd.className = 'poked';
  });
  canvas.addEventListener('pointermove', function (e) {
    var q = pointers[e.pointerId];
    if (!q) return;
    e.preventDefault();
    var p = pos(e);
    if (Math.abs(p.x - q.x) + Math.abs(p.y - q.y) < 1) return;
    p.trail = q.trail + Math.hypot(p.x - q.x, p.y - q.y); p.sprinkled = q.sprinkled;
    if (!feeding) pond.wake(q.x, q.y, p.x, p.y);
    else if (p.trail > pond.fishBase * 0.6 && p.sprinkled < 10) { pond.feed(p.x, p.y, 2); p.trail = 0; p.sprinkled++; }
    pointers[e.pointerId] = p;
  });
  function up(e) { delete pointers[e.pointerId]; }
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  var rt = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { pointers = {}; setup(); render(); }, 80);
  });

  setup();
  if (demo) {
    // test-only: fixed pebbles, stepped synchronously so a screenshot has something to show
    var drops = [[0, 0.36, 0.46], [45, 0.63, 0.58], [100, 0.52, 0.27], [150, 0.2, 0.75]];
    for (var s = 0; s < 190; s++) {
      for (var d = 0; d < drops.length; d++) if (drops[d][0] === s) pond.poke(W * drops[d][1], H * drops[d][2], 1);
      if (s === 165) pond.wake(W * 0.72, H * 0.2, W * 0.8, H * 0.3);
      if (s === 175) pond.wake(W * 0.8, H * 0.3, W * 0.86, H * 0.42);
      pond.step();
    }
    window.__pond = pond;
  }
  render();
  start();
})();
</script>
</body>
</html>
