<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stillwater Koi</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14171f; color: #e9e4d8;
    font: 15px/1.45 Georgia, "Iowan Old Style", serif; overscroll-behavior: none; }
  #c { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; cursor: pointer; }
  [hidden] { display: none !important; }
  h1, h2, h3, p { margin: 0; font-weight: normal; }
  .muted { color: #a59f90; }
  svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .glass { background: rgba(16,22,30,0.86); border: 1px solid rgba(233,228,216,0.14); box-shadow: 0 8px 30px rgba(0,0,0,0.35); }
  button { font: inherit; color: inherit; background: rgba(233,228,216,0.08); border: 1px solid rgba(233,228,216,0.18);
    border-radius: 10px; min-height: 44px; padding: 0 16px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:hover { background: rgba(233,228,216,0.14); }
  button:focus-visible { outline: 2px solid #c9a85c; outline-offset: 2px; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.gold { background: rgba(201,168,92,0.22); border-color: rgba(201,168,92,0.6); }

  /* ---- top: just the purse ---- */
  #hud { position: fixed; left: calc(12px + env(safe-area-inset-left)); top: calc(10px + env(safe-area-inset-top));
    display: flex; gap: 8px; pointer-events: none; user-select: none; }
  .pill { display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px 0 9px; border-radius: 18px;
    font-size: 16px; font-variant-numeric: tabular-nums; }
  .pill svg { width: 20px; height: 20px; }
  .pill.small { padding: 0 13px; font-size: 14px; color: #c9c3b4; }

  #stars { color: #dcbc5e; letter-spacing: 1px; }
  #goal { position: fixed; left: calc(12px + env(safe-area-inset-left)); top: calc(54px + env(safe-area-inset-top)); min-height: 0; height: 34px; border-radius: 17px;
    font-size: 14px; gap: 4px; padding: 0 12px; cursor: default; z-index: 1; }
  #goal .price { min-width: 0; gap: 4px; margin-left: 2px; } #goal .price svg { width: 15px; height: 15px; }
  #goal.done { border-color: #c9a85c; background: rgba(60,48,20,0.92); color: #e9e4d8; cursor: pointer; animation: glow 1.6s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 4px rgba(201,168,92,0.25); } }
  @media (prefers-reduced-motion: reduce) { #goal.done { animation: none; } }
  .plan { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-top: 10px; }
  .plan button { min-height: 68px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; line-height: 1.2; border-radius: 10px; }
  .plan button b { font-weight: normal; font-size: 13px; } .plan button span { color: #a59f90; font-size: 11px; }
  .plan .far { background: rgba(233,228,216,0.02); border-style: dashed; opacity: 0.5; }
  .plan .free { border-color: rgba(201,168,92,0.6); border-style: dashed; } .plan .free b { font-size: 20px; color: #dcbc5e; }
  .plan .k-pond { background: rgba(35,71,74,0.9); }
  .plan .k-pond.b-snow { background: rgba(120,140,155,0.8); } .plan .k-pond.b-maple { background: rgba(120,70,44,0.8); } .plan .k-pond.b-lotus { background: rgba(110,70,100,0.8); }
  .plan .k-pond.b-lantern { background: rgba(20,22,48,0.95); } .plan .k-pond.b-spring { background: rgba(60,110,84,0.85); } .plan .k-market, .plan .k-dango, .plan .k-tea, .plan .k-shrine { background: rgba(125,74,60,0.5); }
  .plan .k-zen { background: rgba(179,168,141,0.35); } .plan .k-moss, .plan .k-bamboo, .plan .k-nursery { background: rgba(63,90,60,0.6); } .plan .k-hatchery { background: rgba(86,106,110,0.6); }
  #toasts { position: fixed; left: 50%; top: calc(58px + env(safe-area-inset-top)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px);
    display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 3; }
  .toast { padding: 7px 16px; border-radius: 20px; text-align: center; transition: opacity 1s ease; }
  .toast.out { opacity: 0; }

  /* ---- bottom: one bar ---- */
  #bar { position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; align-items: stretch; gap: 2px; padding: 5px; border-radius: 20px; z-index: 2; }
  #bar button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    min-width: 66px; min-height: 54px; padding: 4px 6px; border: 0; background: none; border-radius: 15px; font-size: 12px; color: #c9c3b4; }
  #bar button:hover, #bar button[aria-pressed="true"] { background: rgba(233,228,216,0.1); color: #e9e4d8; }
  #bar #hand { min-width: 84px; color: #e9e4d8; background: rgba(201,168,92,0.2); }
  #bar .sep { width: 1px; margin: 8px 3px 8px 0; background: rgba(233,228,216,0.14); }
  .badge { position: absolute; right: 9px; top: 3px; min-width: 17px; height: 17px; border-radius: 9px; background: #c9a85c; color: #1a1d24;
    font: 11px/17px Georgia, serif; text-align: center; }

  #menuBtn { position: fixed; right: calc(10px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); width: 44px; height: 44px; min-height: 0; padding: 0;
    border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2; }
  #ready { color: #dcbc5e; }
  /* the garden is the game: only the purse stays, and even that fades when the screen is left alone */
  #count, #stars, #basket { display: none; }
  #hud, #goal { opacity: calc(1 - var(--calm, 0) * 0.92); }
  .nav { opacity: calc(1 - var(--calm, 0)); }
  #bar, #menuBtn { opacity: calc(1 - var(--calm, 0) * 0.75); }
  #bar #watch[aria-pressed="true"] { background: rgba(201,168,92,0.2); color: #e9e4d8; }
  #gatepill { pointer-events: auto; min-height: 0; cursor: pointer; }
  #gatepill.full { border-color: #c9a85c; color: #e8cd82; background: rgba(60,48,20,0.92); }

  /* ---- arrows at the edge when there is more garden that way ---- */
  .nav { position: fixed; width: 44px; height: 44px; min-height: 0; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 1; }
  .nav.locked { color: #8d8a80; }
  #navL { left: calc(8px + env(safe-area-inset-left)); top: 50%; margin-top: -22px; } #navL svg { transform: rotate(180deg); }
  #navR { right: calc(8px + env(safe-area-inset-right)); top: 50%; margin-top: -22px; }
  #navU { top: calc(8px + env(safe-area-inset-top)); left: 50%; margin-left: -22px; } #navU svg { transform: rotate(-90deg); }
  #navD { bottom: calc(86px + env(safe-area-inset-bottom)); left: 50%; margin-left: -22px; } #navD svg { transform: rotate(90deg); }

  #zoom { position: fixed; right: calc(10px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column;
    border-radius: 22px; overflow: hidden; z-index: 1; }
  #zoom button { width: 44px; min-height: 42px; padding: 0; border: 0; border-radius: 0; background: none; font-size: 22px; line-height: 1; }
  #zoom button:hover { background: rgba(233,228,216,0.12); }

  /* ---- sheets: one pop-up at a time ---- */
  #scrim { position: fixed; inset: 0; background: rgba(8,11,16,0.55); z-index: 4; }
  #sheet { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 560px; max-width: calc(100% - 24px); max-height: min(86%, 720px);
    display: flex; flex-direction: column; border-radius: 18px; z-index: 5; overflow: hidden; }
  #sheet.wide { width: 1000px; }
  #sheet header { display: flex; align-items: center; gap: 6px; padding: 10px 10px 8px 18px; border-bottom: 1px solid rgba(233,228,216,0.1); }
  #sheet header h2 { flex: 1; font-size: 19px; }
  .tabs { flex: 1; display: flex; gap: 6px; margin-left: -8px; }
  .tabs button { min-height: 38px; border-radius: 19px; padding: 0 16px; background: none; border-color: transparent; color: #a59f90; }
  .tabs button[aria-pressed="true"] { background: rgba(233,228,216,0.1); color: #e9e4d8; }
  .x { width: 40px; min-height: 40px; padding: 0; border-radius: 50%; border: 0; background: none; font-size: 22px; line-height: 1; }
  #body { padding: 6px 18px 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #body > p { margin: 8px 0 6px; }
  #body h3 { font-size: 12px; letter-spacing: 0.09em; text-transform: uppercase; color: #a59f90; margin: 16px 0 2px; }

  .row { display: flex; align-items: center; gap: 12px; padding: 10px 8px; margin: 0 -8px; border-radius: 10px; border-top: 1px solid rgba(233,228,216,0.07); }
  .row.click { cursor: pointer; }
  .row.click:hover { background: rgba(233,228,216,0.07); }
  .row .grow, .counter .grow { flex: 1; min-width: 0; }
  .sub { color: #a59f90; font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .price { display: inline-flex; align-items: center; gap: 6px; min-width: 78px; justify-content: center; font-variant-numeric: tabular-nums; }
  .price svg { width: 16px; height: 16px; }
  .sw { width: 26px; height: 26px; border-radius: 50%; flex: none; position: relative; border: 1px solid rgba(0,0,0,0.35); }
  .sw i { position: absolute; right: -3px; bottom: -3px; width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.4); }
  .sw.q { background: #2a313a; color: #8d8a80; font-size: 13px; line-height: 26px; text-align: center; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .req { border-top: 1px solid rgba(233,228,216,0.07); padding-bottom: 10px; }
  .req .row { border-top: 0; padding-bottom: 2px; }
  .book { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-top: 10px; }
  .bk { display: flex; align-items: center; gap: 9px; font-size: 13px; line-height: 1.25; min-width: 0; }
  .bk.un { color: #6f6c64; }

  /* the dealer's shop front */
  .awning { height: 34px; margin: 4px -18px 0; background: repeating-linear-gradient(90deg, #7d4a3c 0 48px, #d8cdb6 48px 96px);
    box-shadow: inset 0 -10px 12px rgba(0,0,0,0.28); }
  .tanks { display: flex; gap: 14px; margin: 14px 0 0; padding-bottom: 12px; border-bottom: 10px solid #4a3828; }
  .tank { flex: 1; min-width: 0; cursor: pointer; border-radius: 8px; padding: 7px; background: #1b1511; border: 2px solid #5b4632; }
  .tank.on { border-color: #c9a85c; box-shadow: 0 0 0 2px rgba(201,168,92,0.3); }
  .tank.sold { cursor: default; opacity: 0.55; }
  .tank canvas { width: 100%; height: auto; display: block; border-radius: 4px; }
  .tag { display: flex; justify-content: space-between; gap: 8px; margin-top: 7px; padding: 5px 9px; background: #d8cdb6; color: #2b221b; border-radius: 4px; font-size: 13px; }
  .tag .muted { color: #6f6557; }
  .counter { display: flex; align-items: center; gap: 12px; margin-top: 14px; }

  /* ---- the card for one koi or one garden thing ---- */
  #card { position: fixed; left: calc(12px + env(safe-area-inset-left)); bottom: calc(86px + env(safe-area-inset-bottom)); width: 330px; max-width: calc(100% - 24px);
    box-sizing: border-box; padding: 14px 16px; border-radius: 16px; z-index: 2; }
  #card h2 { font-size: 19px; padding-right: 36px; }
  #card .x { position: absolute; right: 6px; top: 6px; }
  #card .note { color: #a59f90; font-size: 13px; margin-top: 8px; }
  .pre { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(233,228,216,0.1); }
  .prow { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 14px; }
  .prow .sw { width: 16px; height: 16px; line-height: 16px; font-size: 11px; }
  .prow .sw i { width: 8px; height: 8px; right: -2px; bottom: -2px; }
  .prow .grow { flex: 1; } .prow .num { color: #a59f90; }

  #placebar { position: fixed; left: 50%; top: calc(58px + env(safe-area-inset-top)); transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
    padding: 7px 8px 7px 18px; border-radius: 26px; width: max-content; max-width: calc(100% - 24px); box-sizing: border-box; z-index: 3; }
  #placebar .grow { min-width: 0; } #placebar button { min-height: 40px; border-radius: 20px; white-space: nowrap; }

  #away { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 380px; max-width: calc(100% - 32px);
    padding: 22px 24px; box-sizing: border-box; text-align: center; border-radius: 18px; z-index: 6; }
  #away h2 { font-size: 20px; margin-bottom: 8px; }
  #away p { margin-bottom: 6px; }
  #away button { margin-top: 12px; }

  #cursor { position: fixed; left: 0; top: 0; width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%;
    border: 2px solid rgba(233,228,216,0.85); box-shadow: 0 0 0 1px rgba(8,12,18,0.6), 0 0 10px rgba(8,12,18,0.5);
    pointer-events: none; z-index: 10; }
  #cursor::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #e9e4d8; }
  #padhint { position: fixed; right: 66px; top: 22px; color: #c9c3b4; font-size: 13px; pointer-events: none; text-shadow: 0 1px 6px rgba(8,12,18,0.9); }

  /* ---- phones ---- */
  @media (max-width: 640px) {
    #ready { display: none; }
    #sheet, #sheet.wide { left: 0; right: 0; top: auto; bottom: 0; transform: none; width: auto; max-width: none; max-height: 82%; border-radius: 18px 18px 0 0; border-width: 1px 0 0;
      padding-bottom: env(safe-area-inset-bottom); }
    #card { left: 8px; right: 8px; width: auto; max-width: none; bottom: calc(76px + env(safe-area-inset-bottom)); }
    #navD { bottom: calc(78px + env(safe-area-inset-bottom)); }
    .tanks { flex-direction: column; gap: 8px; } .tank { display: flex; align-items: center; gap: 10px; } .tank canvas { width: 46%; } .tank .tag { flex: 1; margin: 0; flex-direction: column; }
    .book { grid-template-columns: 1fr; }
    #padhint { display: none; }
    #hud { flex-wrap: wrap; max-width: calc(100% - 24px); } #basket { display: none; }
    #goal { top: calc(92px + env(safe-area-inset-top)); max-width: calc(100% - 24px); }
    #toasts { top: calc(134px + env(safe-area-inset-top)); }
    #zoom { bottom: calc(80px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="pill glass"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#dcbc5e" stroke="#a8873a"/><circle cx="12" cy="12" r="5.5" stroke="#a8873a" stroke-width="1"/></svg><span id="coins">0</span></div>
  <div class="pill small glass" id="count"></div>
  <div class="pill small glass" id="stars"></div>
  <button class="pill small glass" id="gatepill" data-act="gogate" aria-label="Go to the ticket gate"></button>
  <div class="pill small glass" id="basket" hidden></div>
  <div class="pill small glass" id="ready" hidden></div>
</div>
<button id="goal" class="pill small glass" data-act="goal" hidden></button>
<div id="toasts"></div>

<button class="nav glass" id="navL" data-nav="l" aria-label="Look left" hidden><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
<button class="nav glass" id="navR" data-nav="r" aria-label="Look right" hidden><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
<button class="nav glass" id="navU" data-nav="u" aria-label="Look up" hidden><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
<button class="nav glass" id="navD" data-nav="d" aria-label="Look down" hidden><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>

<section id="card" class="glass" hidden></section>
<div id="placebar" class="glass" hidden></div>

<nav id="bar" class="glass">
  <button id="hand" data-act="hand" aria-label="Switch between feeding and playing"></button>
  <button id="watch" data-act="watch" aria-pressed="false" aria-label="Sit back and watch"></button>
</nav>
<button id="menuBtn" class="glass" data-sheet="menu" aria-label="Menu" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

<div id="scrim" data-act="close" hidden></div>
<aside id="sheet" class="glass" hidden><header id="head"></header><div id="body"></div></aside>

<div id="away" class="glass" hidden></div>
<div id="padhint" hidden>A use &nbsp;&middot;&nbsp; B back &nbsp;&middot;&nbsp; X feed / play &nbsp;&middot;&nbsp; Y stations &nbsp;&middot;&nbsp; right stick next plot</div>
<div id="cursor" hidden></div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script src="src/water.js?v=1795567394"></script>
<script src="src/sim.js?v=1795567394"></script>
<script src="src/render.js?v=1795567394"></script>
<script src="src/audio.js?v=1795567394"></script>
<script src="src/main.js?v=1795567394"></script>
</body>
</html>
